name: Android CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Sign and publish a release from main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android 36 build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest
      - name: Detect signing configuration
        id: signing
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.SIGNINGKEYBASE64 }}
          SIGNING_ALIAS: ${{ secrets.ALIAS }}
          STORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          if [[ -n "$SIGNING_KEY" && -n "$SIGNING_ALIAS" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'No signing configuration; unsigned APK remains available.'
          fi
      - name: Sign installable APK
        if: steps.signing.outputs.ready == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNINGKEYBASE64 }}
          SIGNING_ALIAS: ${{ secrets.ALIAS }}
          STORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/fcmfix-signing.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          APK_DIR='app/build/outputs/apk/release'
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -p -f 4 "$APK_DIR/app-release-unsigned.apk" "$APK_DIR/app-release-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE_PATH" --ks-key-alias "$SIGNING_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$APK_DIR/app-release-signed.apk" "$APK_DIR/app-release-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK_DIR/app-release-signed.apk"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk
          path: app/build/outputs/apk/release
      - name: Read version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          mv app/build/outputs/apk/release/app-release-signed.apk "fcmfix-${VERSION_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_NAME }}
          name: ${{ env.VERSION_NAME }}
          files: fcmfix-${{ env.VERSION_NAME }}.apk
