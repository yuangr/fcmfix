name: Android CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Sign and publish a release from main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release
      - name: Check signing configuration
        env:
          SIGNING_KEY: ${{ secrets.SIGNINGKEYBASE64 }}
          SIGNING_ALIAS: ${{ secrets.ALIAS }}
          STORE_PASSWORD: ${{ secrets.KEYSTOREPASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          if [[ -z "$SIGNING_KEY" || -z "$SIGNING_ALIAS" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo 'Signing secrets must be configured before publishing.' >&2
            exit 1
          fi
      - name: Select build tools
        run: echo "BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -n 1)" >> "$GITHUB_ENV"
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNINGKEYBASE64 }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTOREPASSWORD }}
          keyPassword: ${{ secrets.KEYPASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}
      - name: Read version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          mv app/build/outputs/apk/release/app-release-unsigned-signed.apk "fcmfix-${VERSION_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_NAME }}
          name: ${{ env.VERSION_NAME }}
          files: fcmfix-${{ env.VERSION_NAME }}.apk
